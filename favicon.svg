<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Task Flow"
>
  <defs>
    <linearGradient
      id="taskFlowGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#6366f1"
      />

      <stop
        offset="100%"
        stop-color="#14b8a6"
      />
    </linearGradient>
  </defs>

  <rect
    width="64"
    height="64"
    rx="16"
    fill="url(#taskFlowGradient)"
  />

  <path
    d="M16 33l11 11 21-24"
    fill="none"
    stroke="#ffffff"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="7"
  />
</svg>